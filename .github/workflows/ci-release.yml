name: UniPass CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. QUALITY ASSURANCE & TESTING
  # ---------------------------------------------------------------------------
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
          cache: true

      - name: Run Code Formatting Check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted cleanly:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: './...'

      - name: Run Unit Tests
        run: go test -v ./...

  # ---------------------------------------------------------------------------
  # 2. CROSS-PLATFORM RELEASE BUILD
  # ---------------------------------------------------------------------------
  release:
    name: Build & Publish Release
    needs: test-and-lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Cross-Compile Binaries
        run: make build-all VERSION=${GITHUB_REF_NAME#v}

      - name: Generate Checksums (SHA-256)
        run: |
          cd bin
          sha256sum * > SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/unipass-linux-amd64
            bin/unipass-linux-arm64
            bin/unipass-darwin-amd64
            bin/unipass-darwin-arm64
            bin/unipass-windows-amd64.exe
            bin/unipass-windows-arm64.exe
            bin/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
